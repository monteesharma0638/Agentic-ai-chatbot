<!--
  Robo Rupee chat: INLINE version.
  The chat sits where you paste it and scrolls with the page (it is not fixed to the window).

  How to use
  1. Paste everything from START to END where the chat should appear.
     In dashboard.html, replace the "Ask AI" card with it, i.e. this whole block:
         <div class="gcard dashboard-ask-ai-box w-100 mb-4"> … </div>
     (keep the <div class="col-md-6"> around it).
  2. Change "height: 560px" if you want a taller or shorter chat. 480px is the smallest it draws.

  Good to know
  - One chat per page: use this file or chat-floating.html on a page, not both (only one of them loads).
  - The page's address must be in ALLOWED_ORIGINS on the chat server, the same as for the floating version.
  - It turns light or dark with the page's theme toggle (body.light-theme).
  - The conversation carries over to the floating chat on your other pages, and back.
  - Optional attributes for the <script> tag (see docs/embed-any-website.md):
      data-token="…"            signed-in user (greets them by name, "my investments" questions)
      data-onboarding="false"   skip the quick questions before the first chat
      data-title="…"            name in the chat header (default: the assistant's name)
-->

<!-- START: Robo Rupee chat (inline) -->
<div id="rr-chat-inline" style="width: 100%; height: 560px; margin-bottom: 1.5rem;"></div>
<script
  src="https://mcp-server-ten-eta.vercel.app/embed.js"
  data-mode="inline"
  data-target="#rr-chat-inline"
  defer
></script>
<!-- END: Robo Rupee chat (inline) -->
